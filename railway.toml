[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ─── Cron job setup ───────────────────────────────────────────────────────────
#
# Railway doesn't configure crons in this file — you set them up in the
# Railway dashboard under your project > New Service > Cron.
#
# Settings to use when creating the cron service:
#
#   Schedule:  0 22 * * 0          (Sunday at 10 PM UTC — adjust if needed)
#   Command:   curl -s -X POST $APP_URL/api/cron/weekly-reports \
#                   -H "Authorization: Bearer $CRON_SECRET"
#
# Environment variables to add to the cron service (copy from your main service):
#   APP_URL        = https://your-penny-app.railway.app
#   CRON_SECRET    = (generate with: openssl rand -hex 32)
#
# Add CRON_SECRET to your main service too — the endpoint checks it.
# ─────────────────────────────────────────────────────────────────────────────
