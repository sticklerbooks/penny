[deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ─── Cron jobs ──────────────────────────────────────────────────────────────
#
# Crons are NOT run by Railway. They live in GitHub Actions, in
# .github/workflows/cron-*.yml — one workflow per endpoint:
#
#   cron-dispatch.yml          every 5 min   POST /api/cron/dispatch
#   cron-nightly-hygiene.yml   4 AM UTC      POST /api/cron/nightly-hygiene
#   cron-weekly-reports.yml    Sun 10 PM UTC POST /api/cron/weekly-reports
#
# Why moved off Railway: the old "cron service runs curl" setup failed silently
# because `curl` without --fail treats a 401/500 as success. The Actions
# workflows use `curl --fail-with-body`, so an auth or server error makes the run
# go red and visible. They also have a manual "Run workflow" button for testing.
#
# Two GitHub repo secrets drive them (Settings > Secrets and variables > Actions):
#   APP_URL      = https://your-penny-app.up.railway.app   (no trailing slash)
#   CRON_SECRET  = (generate once: openssl rand -hex 32)
#
# CRON_SECRET must ALSO be set on this Railway app service — every cron endpoint
# rejects the request with 401 unless the bearer token matches. APP_URL lives
# only in GitHub.
# ─────────────────────────────────────────────────────────────────────────────
